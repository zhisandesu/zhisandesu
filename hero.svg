<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ZHISAN — Interactive Creative Universe</title>
  <desc id="desc">A dark cinematic banner with blue and violet signals surrounding the ZHISAN wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070c"/>
      <stop offset="0.52" stop-color="#070b14"/>
      <stop offset="1" stop-color="#100a19"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(930 105) rotate(145) scale(520 300)">
      <stop offset="0" stop-color="#2fbef7" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#2675e8" stop-opacity=".06"/>
      <stop offset="1" stop-color="#2675e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(300 390) rotate(-28) scale(470 260)">
      <stop offset="0" stop-color="#a55cff" stop-opacity=".17"/>
      <stop offset=".55" stop-color="#5a35b6" stop-opacity=".05"/>
      <stop offset="1" stop-color="#5a35b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="155" y1="0" x2="1050" y2="0">
      <stop stop-color="#7de4ff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#7de4ff"/>
      <stop offset=".62" stop-color="#ad8cff"/>
      <stop offset="1" stop-color="#ad8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#91c8ff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="26" fill="url(#blueGlow)"/>
  <rect width="1200" height="420" rx="26" fill="url(#violetGlow)"/>

  <g fill="none">
    <circle cx="1000" cy="150" r="177" stroke="#69d9ff" stroke-opacity=".13"/>
    <circle cx="1000" cy="150" r="137" stroke="#b38cff" stroke-opacity=".11" stroke-dasharray="3 10"/>
    <path d="M833 150a167 167 0 0 1 292-111" stroke="#69d9ff" stroke-opacity=".62" stroke-width="2"/>
    <path d="M877 257a137 137 0 0 0 251-25" stroke="#b38cff" stroke-opacity=".54" stroke-width="2"/>
    <path d="M76 80h105M76 80v65M1124 342h-105M1124 342v-65" stroke="#c7dbff" stroke-opacity=".22"/>
  </g>

  <g transform="translate(76 72)">
    <text x="0" y="18" fill="#76ddff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="5">CREATIVE SIGNAL  /  001</text>
    <text x="-3" y="153" fill="#f4f7ff" font-family="Arial Black, Segoe UI, sans-serif" font-size="108" font-weight="900" letter-spacing="10">ZHISAN</text>
    <rect x="2" y="181" width="700" height="2" rx="1" fill="url(#signal)"/>
    <text x="2" y="230" fill="#bdc7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="3">INTERACTIVE CREATIVE UNIVERSE</text>
    <text x="2" y="271" fill="#778399" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1.5">IMAGE  ·  CODE  ·  AI VIDEO  ·  MUSIC  ·  DARK FANTASY</text>
  </g>

  <g transform="translate(913 66)">
    <circle cx="87" cy="84" r="6" fill="#86e5ff"/>
    <circle cx="87" cy="84" r="23" fill="#86e5ff" opacity=".14" filter="url(#blur)"/>
    <path d="M87 84 153 39M87 84 28 143M87 84l98 61" stroke="#9deaff" stroke-opacity=".24"/>
    <text x="87" y="283" text-anchor="middle" fill="#7e8da6" font-family="Consolas, monospace" font-size="12" letter-spacing="2">ZHISAN.SITE</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="25.25" fill="none" stroke="#8fdfff" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
