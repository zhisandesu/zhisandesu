<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Current creative focus</title>
  <desc id="desc">Three cards: AI-guided interfaces, music archives, and spatial fiction.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08101a"/>
      <stop offset="1" stop-color="#0e0b17"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#63dcff"/>
      <stop offset="1" stop-color="#b08bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="250" rx="22" fill="#05080e"/>
  <text x="40" y="39" fill="#738198" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4">CURRENT TRANSMISSION</text>
  <circle cx="1160" cy="32" r="4" fill="#63dcff"/>
  <circle cx="1160" cy="32" r="10" fill="none" stroke="#63dcff" stroke-opacity=".24"/>

  <g transform="translate(40 65)">
    <rect width="350" height="145" rx="15" fill="url(#panel)" stroke="#63dcff" stroke-opacity=".19"/>
    <rect x="20" y="23" width="32" height="3" rx="1.5" fill="#63dcff"/>
    <text x="20" y="69" fill="#eef7ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">AI-GUIDED INTERFACE</text>
    <text x="20" y="101" fill="#8290a6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Character · voice · navigation</text>
    <text x="314" y="124" text-anchor="end" fill="#63dcff" font-family="Consolas, monospace" font-size="11">01</text>
  </g>

  <g transform="translate(425 65)">
    <rect width="350" height="145" rx="15" fill="url(#panel)" stroke="#8baeff" stroke-opacity=".19"/>
    <rect x="20" y="23" width="32" height="3" rx="1.5" fill="#8baeff"/>
    <text x="20" y="69" fill="#eef7ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">MUSIC ARCHIVE</text>
    <text x="20" y="101" fill="#8290a6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Records · lyrics · digital singer</text>
    <text x="314" y="124" text-anchor="end" fill="#8baeff" font-family="Consolas, monospace" font-size="11">02</text>
  </g>

  <g transform="translate(810 65)">
    <rect width="350" height="145" rx="15" fill="url(#panel)" stroke="#b08bff" stroke-opacity=".2"/>
    <rect x="20" y="23" width="32" height="3" rx="1.5" fill="#b08bff"/>
    <text x="20" y="69" fill="#eef7ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">SPATIAL FICTION</text>
    <text x="20" y="101" fill="#8290a6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Dark fantasy · scenes · 3D props</text>
    <text x="314" y="124" text-anchor="end" fill="#b08bff" font-family="Consolas, monospace" font-size="11">03</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="248.5" rx="21.25" fill="none" stroke="url(#line)" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
