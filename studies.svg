<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Selected self-initiated visual studies</title>
  <desc id="desc">Three editorial visual compositions exploring signal identity, motion systems, and narrative space.</desc>
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05090f"/>
      <stop offset="1" stop-color="#0c0a16"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#64ddff"/>
      <stop offset="1" stop-color="#b184ff"/>
    </linearGradient>
    <radialGradient id="eye" cx="0" cy="0" r="1" gradientTransform="translate(356 251) rotate(90) scale(150)">
      <stop stop-color="#65ddff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#605cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="540" rx="18" fill="#020509"/>

  <g>
    <rect x="30" y="30" width="682" height="480" rx="14" fill="url(#bgA)" stroke="#83ddff" stroke-opacity=".17"/>
    <text x="58" y="68" fill="#6f7f94" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.5">SELF-INITIATED STUDY / IDENTITY</text>
    <text x="58" y="126" fill="#edf2f8" font-family="Arial Black, Segoe UI, sans-serif" font-size="40" font-weight="900">SIGNAL IDENTITY</text>
    <text x="58" y="156" fill="#8090a5" font-family="Segoe UI, Arial, sans-serif" font-size="14">A visual language built from attention, distance, and interference.</text>
    <circle cx="411" cy="314" r="154" fill="url(#eye)"/>
    <ellipse cx="411" cy="314" rx="223" ry="104" fill="none" stroke="#75ddff" stroke-opacity=".38"/>
    <ellipse cx="411" cy="314" rx="166" ry="75" fill="none" stroke="#a287ff" stroke-opacity=".35" stroke-dasharray="3 8"/>
    <circle cx="411" cy="314" r="49" fill="#07131d" stroke="#83e5ff" stroke-opacity=".45"/>
    <circle cx="411" cy="314" r="10" fill="#82e6ff"/>
    <path d="M188 314h446M411 194v240" stroke="#b9dbef" stroke-opacity=".08"/>
    <path d="M226 399h366" stroke="url(#signal)" stroke-opacity=".42"/>
    <text x="58" y="470" fill="#657489" font-family="Consolas, monospace" font-size="10" letter-spacing="1.2">ATTENTION BECOMES FORM / 2026</text>
  </g>

  <g>
    <rect x="738" y="30" width="432" height="226" rx="14" fill="url(#bgA)" stroke="#9ba9ff" stroke-opacity=".17"/>
    <text x="764" y="66" fill="#6f7f94" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3">SELF-INITIATED STUDY / TIME</text>
    <text x="764" y="113" fill="#edf2f8" font-family="Arial Black, Segoe UI, sans-serif" font-size="29" font-weight="900">MOTION SYSTEM</text>
    <path d="M764 171c21 0 21-38 42-38s21 58 42 58 21-83 42-83 21 99 42 99 21-74 42-74 21 43 42 43 21-19 42-19 21 6 42 6" fill="none" stroke="url(#signal)" stroke-width="2.5"/>
    <g fill="#8190a5" font-family="Consolas, monospace" font-size="9">
      <text x="764" y="224">RHYTHM</text><text x="902" y="224">TENSION</text><text x="1052" y="224">RELEASE</text>
    </g>
  </g>

  <g>
    <rect x="738" y="282" width="432" height="228" rx="14" fill="url(#bgA)" stroke="#ae87ff" stroke-opacity=".17"/>
    <text x="764" y="318" fill="#6f7f94" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3">SELF-INITIATED STUDY / SPACE</text>
    <text x="764" y="365" fill="#edf2f8" font-family="Arial Black, Segoe UI, sans-serif" font-size="29" font-weight="900">NARRATIVE SPACE</text>
    <path d="M956 382 1074 484H838Z" fill="#0b1320" stroke="#a98aff" stroke-opacity=".42"/>
    <path d="M956 382v102M838 484l118-54 118 54" fill="none" stroke="#78dfff" stroke-opacity=".24"/>
    <circle cx="956" cy="430" r="8" fill="#9d95ff"/>
    <circle cx="956" cy="430" r="30" fill="none" stroke="#7fe4ff" stroke-opacity=".2"/>
    <text x="764" y="480" fill="#718096" font-family="Segoe UI, Arial, sans-serif" font-size="12">Story becomes place. Place becomes memory.</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="538.5" rx="17.25" fill="none" stroke="#8fdfff" stroke-opacity=".12" stroke-width="1.5"/>
</svg>
