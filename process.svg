<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Working method</title>
  <desc id="desc">A six-stage visual design process: observe, frame, direct, systemize, animate, and refine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05090f"/>
      <stop offset="1" stop-color="#0e0a16"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#64dcff"/>
      <stop offset=".5" stop-color="#879fff"/>
      <stop offset="1" stop-color="#b184ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="18" fill="url(#bg)"/>
  <text x="42" y="38" fill="#6f7f94" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.5">FROM IMPRESSION TO SYSTEM</text>
  <path d="M74 116h1052" stroke="url(#line)" stroke-width="2" stroke-opacity=".54"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(76 116)">
      <circle r="7" fill="#65dcff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">OBSERVE</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">context</text>
    </g>
    <g transform="translate(286 116)">
      <circle r="7" fill="#72c9ff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">FRAME</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">point of view</text>
    </g>
    <g transform="translate(496 116)">
      <circle r="7" fill="#82b3ff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">DIRECT</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">visual thesis</text>
    </g>
    <g transform="translate(706 116)">
      <circle r="7" fill="#929dff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">SYSTEMIZE</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">rules &amp; language</text>
    </g>
    <g transform="translate(916 116)">
      <circle r="7" fill="#a38aff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">ANIMATE</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">rhythm &amp; behavior</text>
    </g>
    <g transform="translate(1126 116)">
      <circle r="7" fill="#b184ff"/>
      <text x="0" y="-23" text-anchor="middle" fill="#eaf1f8" font-size="16" font-weight="650">REFINE</text>
      <text x="0" y="39" text-anchor="middle" fill="#718196" font-size="11">final tension</text>
    </g>
  </g>
  <text x="600" y="202" text-anchor="middle" fill="#66758a" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">FEELING → FORM → SYSTEM → EXPERIENCE</text>
  <rect x=".75" y=".75" width="1198.5" height="228.5" rx="17.25" fill="none" stroke="#8fdfff" stroke-opacity=".13" stroke-width="1.5"/>
</svg>
